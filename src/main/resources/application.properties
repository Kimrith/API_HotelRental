spring.application.name=API_HOTEL
server.port=8030

# Docker PostgreSQL (hotel_postgres_db on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/hotel_rental_db
spring.datasource.username=admin
spring.datasource.password=setec_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=uploads/rooms